<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Lift Tracker</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 24px 16px;
      background: #0f172a;
      color: #f8fafc;
    }
    h1 { font-size: 1.5rem; margin-bottom: 16px; }
    h2 { font-size: 1.1rem; margin-top: 24px; color: #94a3b8; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 4px; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
      font-size: 1rem;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #3b82f6;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      margin-top: 8px;
      cursor: pointer;
    }
    .history-list {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-info { display: flex; flex-direction: column; gap: 4px; }
    .exercise-title { font-weight: 600; font-size: 1rem; }
    .exercise-stats { font-size: 0.9rem; color: #38bdf8; }
    .exercise-date { font-size: 0.75rem; color: #64748b; }
    .delete-btn {
      background: transparent;
      border: none;
      color: #ef4444;
      font-size: 1.2rem;
      cursor: pointer;
      width: auto;
      padding: 4px 8px;
    }
  </style>
</head>
<body>

  <h1>Lift Tracker</h1>

  <div class="form-group">
    <label>Exercise</label>
    <input id="exercise" placeholder="e.g. Barbell Squat" autocomplete="off">
  </div>

  <div class="form-group">
    <label>Sets x Reps</label>
    <input id="setsReps" placeholder="e.g. 3x8" autocomplete="off">
  </div>

  <div class="form-group">
    <label>Weight</label>
    <input id="weight" placeholder="e.g. 35 kg" autocomplete="off">
  </div>

  <button onclick="saveEntry()">Save Set</button>

  <h2>Previous Logs</h2>
  <div class="history-list" id="history"></div>

  <script>
    function loadHistory() {
      const data = JSON.parse(localStorage.getItem('liftLogs') || '[]');
      const container = document.getElementById('history');
      container.innerHTML = '';

      data.forEach((entry, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-info">
            <span class="exercise-title">${entry.exercise}</span>
            <span class="exercise-stats">${entry.setsReps} — ${entry.weight}</span>
            <span class="exercise-date">${entry.date}</span>
          </div>
          <button class="delete-btn" onclick="deleteEntry(${index})">✕</button>
        `;
        container.appendChild(card);
      });
    }

    function saveEntry() {
      const exercise = document.getElementById('exercise').value.trim();
      const setsReps = document.getElementById('setsReps').value.trim();
      const weight = document.getElementById('weight').value.trim();

      if (!exercise || !weight) return;

      const dateStr = new Date().toLocaleDateString(undefined, { 
        month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' 
      });

      const data = JSON.parse(localStorage.getItem('liftLogs') || '[]');
      data.unshift({ exercise, setsReps: setsReps || '1 set', weight, date: dateStr });
      localStorage.setItem('liftLogs', JSON.stringify(data));

      document.getElementById('setsReps').value = '';
      document.getElementById('weight').value = '';
      loadHistory();
    }

    function deleteEntry(index) {
      const data = JSON.parse(localStorage.getItem('liftLogs') || '[]');
      data.splice(index, 1);
      localStorage.setItem('liftLogs', JSON.stringify(data));
      loadHistory();
    }

    loadHistory();
  </script>
</body>
</html>
